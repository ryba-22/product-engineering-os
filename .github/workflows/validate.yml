name: Validate package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: python scripts/validate.py
      - run: python scripts/audit_coverage.py
      - run: python scripts/audit_content_depth.py
      - run: python scripts/audit_package_index.py
      - run: python scripts/audit_adversarial_run.py
      - run: python scripts/audit_independent_eval.py
      - run: python scripts/audit_independent_eval_v2.py
      - run: python scripts/audit_freshness.py
      - run: python scripts/production_evidence.py examples/production-evidence.example.json --check
      - run: python -m pytest tests -q
      - run: python examples/idempotent-enrollment/evaluate.py
