name: Validate package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-validation.txt
      - run: python scripts/validate.py
      - run: python scripts/audit_coverage.py
      - run: python scripts/audit_content_depth.py
      - run: python scripts/audit_package_index.py
      - run: python scripts/audit_adversarial_run.py
      - run: python scripts/audit_independent_eval.py
      - run: python scripts/audit_independent_eval_v2.py
      - run: python scripts/audit_freshness.py
      - name: Source delta gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          EXTRA_ARGS=()
          CANDIDATE_SHA="$HEAD_SHA"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            CANDIDATE_SHA="$PR_HEAD_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            BASE_SHA="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
          elif [ "$EVENT_NAME" = "push" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            EXTRA_ARGS+=(--allow-unreachable-report-refs)
          else
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            BASE_SHA="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          python scripts/source_delta.py gate --base-ref "$BASE_SHA" --head-ref "$CANDIDATE_SHA" "${EXTRA_ARGS[@]}"
      - run: python -m pytest tests -q
      - run: python examples/idempotent-enrollment/evaluate.py
